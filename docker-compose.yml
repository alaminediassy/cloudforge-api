services:

  # postgreSQL
  postgres:
    image: postgres:17.1-alpine
    container_name: cloudforge-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: cloudforge
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cloudforge

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudforge} -d ${POSTGRES_DB:-cloudforge}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - cloudforge-network

    # Redis
  redis:
    image: redis:7-alpine
    container_name: cloudforge-redis
    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

    networks:
      - cloudforge-network

  # Cloudforge API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: cloudforge-api:local
    container_name: cloudforge-api
    restart: unless-stopped

    ports:
      - "8081:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cloudforge
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-cloudforge}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - cloudforge-network

# Volumes
volumes:
  postgres_data:

# Networks
networks:
  cloudforge-network:
    driver: bridge