services:
  postgres:
    image: postgres:17.1-alpine
    container_name: cloudforge-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: cloudforge
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cloudforge

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: