spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: cloudforge-api
  jpa:
    show-sql: false

cloudforge:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-expiration: 15m
      refresh-token-expiration: 7d
      issuer: cloudforge-api

# SQL error messages can contain user data. Disable that logger.
# Keep other Hibernate startup and schema warnings.
logging:
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.orm.jdbc.extract: OFF
    org.hibernate.orm.jdbc.batch: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
